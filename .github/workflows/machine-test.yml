name: machine-test

# The tests that depend on the machine, on one kind of machine. `ci` calls it
# once for each kind, and again for a kind whose job never started.
on:
  workflow_call:
    inputs:
      os:
        type: string
        required: true

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ${{ inputs.os }}
    defaults:
      run:
        working-directory: bootstrap
    steps:
      - uses: actions/checkout@v6
      # What `decide` built every case to, which this machine must build to as well.
      - uses: actions/download-artifact@v4
        with:
          name: case-hashes
          path: ${{ runner.temp }}/case-hashes
      # Whether Windows scans each executable the first time it is started is
      # what the first tests that start one may be waiting on. This says
      # whether real-time protection is on, and how long the first and the tenth
      # newly written executable take to start. It changes nothing.
      - name: Time the start of new executables
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "real-time protection: $((Get-MpComputerStatus).RealTimeProtectionEnabled)"
          foreach ($i in 1..10) {
            $exe = Join-Path $env:TEMP "probe-$i.exe"
            Copy-Item "$env:SystemRoot\System32\whoami.exe" $exe
            $t = Measure-Command { & $exe | Out-Null }
            "start $i of a new executable: $([int]$t.TotalMilliseconds) ms"
          }
      - name: Test
        env:
          SMITH_HASHES: ${{ runner.temp }}/case-hashes/case-hashes
        # A server of a thousand connections, and the test that connects to it, each
        # hold a thousand descriptors, and macOS gives a process 256 until it is asked, and
        # holds 128 connections that nothing has accepted until it is told to hold more, as
        # a wave of a thousand needs.
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            ulimit -n 10240 || true
            sudo sysctl -w kern.ipc.somaxconn=4096 || true
            echo "descriptors: $(ulimit -n), connections held: $(sysctl -n kern.ipc.somaxconn)"
          fi
          cargo test --locked -- --group=machine
      # The time of each test, and the tests that became much slower than their
      # own history on this kind of machine, as `ci` does for the first.
      - name: Say which tests became much slower than their own history
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          SMITH_SEED: 0
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            ulimit -n 10240 || true
            sudo sysctl -w kern.ipc.somaxconn=4096 || true
          fi
          cargo test --locked -- --group=machine --times="$RUNNER_TEMP/times"
          sh ../.github/slow-tests.sh "${{ inputs.os }}" "$RUNNER_TEMP/times" --group=machine > "$RUNNER_TEMP/slow" || status=$?
          cat "$RUNNER_TEMP/slow"
          cat "$RUNNER_TEMP/slow" >> "$GITHUB_STEP_SUMMARY"
          exit "${status:-0}"
